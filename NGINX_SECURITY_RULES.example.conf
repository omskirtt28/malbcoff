# Malbcoff v1.0.0 — Nginx / CloudPanel protection example
# Merge these rules into the existing server block; do not replace your SSL/PHP config.

# Never expose application internals or repository data.
location ~* ^/(?:config|core|database|pages|partials|design-reference|\.git)(?:/|$) {
    deny all;
    return 403;
}

# Never serve development/backup/database artifacts from the public web root.
location ~* /(?:\.env(?:\..*)?|\.gitignore|preview\.html|.*\.(?:md|sql|zip|bak|backup|log|ini|dist))$ {
    deny all;
    return 403;
}

# bootstrap.php is included internally by PHP and should not be requested directly.
location = /bootstrap.php {
    deny all;
    return 403;
}

# Prevent directory listing at the Nginx layer.
autoindex off;
